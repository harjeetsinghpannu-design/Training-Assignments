<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Assignment-12</title>
</head>
<link rel="stylesheet" href="style.css"/>
<script defer src="script.js"></script>

<body>
    <header>
        <h1>MATH KIDS</h1>
        <h1>KIDS LEARNING APP</h1>
    </header>
    <main>
        <div class="screen1-wrapper screen">
            <h4>1. Choose a Shape</h4>
            <div class="shapes-wrapper">
                <div class="shape Circle">
                    <svg class="tick-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
                <div class="shape Triangle">
                    <svg class="tick-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
                <div class="shape Square">
                    <svg class="tick-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                        stroke-width="1.5" stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
            </div>
            <button class="next-button">NEXT</button>
        </div>
        <div class="screen2-wrapper screen">
            <h4 class="screen2-title"></h4>
            <input type="number" />
            <button class="calc-button">CALCULATE</button>
        </div>
        <div class="screen3-wrapper screen">
            <div id="chosen-shape" class=""></div>
            <h4 class="chosen-shape-name"></h4>
            <table class="shape-table">
                <tr class="unit">
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
                <tr class="area">
                    <td>AREA</td>
                    <td></td>
                    <td></td>
                </tr>
                <tr class="perimeter">
                    <td>PERIMETER</td>
                    <td></td>
                    <td></td>
                </tr>
            </table>
            <button class="start-again">START AGAIN</button>
        </div>
    </main>
</body>

</html>
