<!DOCTYPE html>
<html lang="en">

<head>

<link rel="stylesheet" href="style.css">

<body>
    <header>
        <h1>MATH KIDS</h1>
        <h1>KIDS LEARNING APP</h1>
    </header>
    <main>
        <div class="screen1-wrapper screen">
            <h4>1. Choose a Shape</h4>
            <div class="shapes-wrapper">
                <div class="shape circle">
                    <svg class="tick-mark" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
                <div class="shape triangle">
                    <svg class="tick-mark"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
                <div class="shape square">
                    <svg class="tick-mark"  xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                        stroke="currentColor" class="size-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="m4.5 12.75 6 6 9-13.5" />
                    </svg>
                </div>
            </div>
            <button class="next-button">NEXT</button>
        </div>
        <div class="screen2-wrapper screen">
            <h4 class="screen2-title"></h4>
            <input type="number"/>
            <button class="calc-button">CALCULATE</button>
        </div>
        <div class="screen3-wrapper screen">
            <div class=""></div>
            <div class="box1">
                <span></span><span></span><span></span>
            </div>
            <div class="box2">
                <span>AREA</span><span></span><span></span>
            </div>
            <div class="box3">
                <span>PERIMETER</span><span></span><span></span>
            </div>
            <button class="start-again">START AGAIN</button>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
