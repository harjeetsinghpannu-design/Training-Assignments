<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 14</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <header>
        <img class="logo" src="Sirius_Logo.svg" alt="Sirius-Logo" />
    </header>
    <main>
        <form class="payment-form" action="GET">
            <h2 class="heading-1">BILLING DETAILS</h2>
            <div class="user-name-wrapper input-wrapper">
                <div class="first-name-wrapper">
                    <label for="first-name">First Name</label>
                    <input type="text" id="first-name" />
                    <p class="first-name-error error-message"></p>
                </div>
                <div class="last-name-wrapper">
                    <label for="last-name">Last Name</label>
                    <input type="text" id="last-name" />
                    <p class="last-name-error error-message"></p>
                </div>
            </div>
            <div class="email-wrapper input-wrapper">
                <label for="email">Email Address</label>
                <input type="email" id="email" />
                <p class="email-error error-message"></p>
            </div>
            <div class="contact-wrapper input-wrapper">
                <label for="contact">Contact Number</label>
                <input type="tel" id="contact" />
                <p class="contact-error error-message"></p>
            </div>
            <div class="pin-wrapper input-wrapper">
                <label for="pin">PIN Code</label>
                <input type="number" id="pin" />
                <p class="pin-error error-message"></p>
            </div>

            <h2 class="heading-2">PAYMENT DETAILS</h2>

            <div class="card-wrapper input-wrapper">
                <label for="card-number">Card Number</label>
                <input type="number" id="card-number" />
                <p class="card-number-error error-message"></p>
            </div>
            <div class="card-details-wrapper input-wrapper">
                <div class="card-expiry-wrapper">
                    <label for="card-expiry">Card Expiry (Year)</label>
                    <input type="number" id="card-expiry" />
                    <p class="card-expiry-error error-message"></p>
                </div>
                <div class="CVV-wrapper">
                    <label for="cvv">CVV</label>
                    <input type="number" id="cvv" />
                    <p class="cvv-error error-message"></p>
                </div>
            </div>
            <button class="complete-payment">COMPLETE PAYMENT</button>
        </form>
        <script src="script.js"></script>
    </main>
</body>

</html>
