<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Assignment 13</title>
    <link rel="stylesheet" href="style.css" />
    <script defer src="script.js"></script>
</head>

<body>
    <header>
        <h1>FRIENDS</h1>
        <button class="add-btn">+</button>
    </header>
    <main>
        <div class="dialog">
            <h2>Add Friend</h2>
            <input type="text" class="friend-first-name-input" placeholder="First Name" />
            <input type="text" class="friend-last-name-input" placeholder="Last Name" />
            <input type="email" class="friend-email-input" placeholder="Email" />
            <input type="text" class="friend-image-input" placeholder="Image URL" />
            <button class="create-btn">Create Friend</button>
            <button class="close-btn">Close</button>
        </div>
        <div class="friends-list-wrapper"></div>
    </main>
</body>

</html>
