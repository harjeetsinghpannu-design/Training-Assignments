<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>FRIENDS</h1>
        <button class="add-btn">+</button>
    </header>
    <main>
        <div class="dialog">
            <h2>Add Friend</h2>
            <input type="text" class="friend-name-input" placeholder="Name">
            <input type="email" class="friend-email-input" placeholder="Email">
            <input type="text" class="friend-image-input" placeholder="Image URL">
            <button class="create-btn">Create Friend</button>
            <button class="close-btn">Close</button>
        </div>
        <div class="friends-list-wrapper">
            <div class="friend-card">
                <div class="friend-image">
                    <img src="http://dummyimage.com/104x144.jpg/5fa2dd/ffffff" alt="">
                </div>
                <div class="friend-details">
                    <h2 class="friend-name">Mehetabel Holley</h2>
                    <p class="friend-email">mholley0@nature.com</p>
                </div>
            </div>

        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
